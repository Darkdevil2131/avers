<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Noesis</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}

.meter[data-g="3"] i:nth-child(-n+3){background:var(--g3)}.meter[data-g="4"] i{background:var(--g4)}

@media(max-width:800px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}
@media(prefers-reduced-motion:no-preference){.item{transition:border-color .2s}}
</style></head><body><div class="app">
<aside><div><h1>Noesis</h1><p class="sub">Evidence review for research papers</p></div>
<div><label class="sub" for="key">API key (if the server requires one)</label><input id="key" type="password" autocomplete="off"></div>

<div class="row" style="margin-top:6px"><button class="btn ghost" id="lg">Log in</button><button class="btn ghost" id="rg">Register</button></div><p class="sub" id="acctmsg"></p></div>
<div class="row"><input id="pname" type="text" placeholder="New project name" aria-label="New project name"><button class="btn" id="mk">Create project</button></div>
<div class="plist" id="plist" role="list"></div></aside>
<main><nav class="tabs" id="tabs" role="tablist"></nav><section id="view" aria-live="polite"></section></main></div>
<script>

  h('div',{},h('span',{class:'tag '+tone(b.support_class)},b.support_class.replace(/_/g,' ')),h('span',{class:'tag'},'assessment: '+b.assessment.replace(/_/g,' ')),h('span',{class:'tag'},'uncertainty: '+b.uncertainty),h('span',{class:'tag'},'independent sources: '+b.n_effective)),

  h('p',{},x.scientific_gap),h('p',{class:'sub'},'Novelty check: '+x.novelty_assessment.verdict.replace(/_/g,' ')+' in '+x.novelty_assessment.corpus_size+' texts on '+x.novelty_assessment.search_date+'. '+x.novelty_assessment.limitation),
  e.design?h('div',{class:'ev'},h('b',{},'Proposed experiment (not run): '),e.design,h('div',{},'Sample size ≈ '+e.sample_size.n_per_group+' per group, assuming effect size d='+e.sample_size.assumed_effect_size_d),h('div',{},'Succeeds if: '+e.success_criteria),h('div',{},'Fails if: '+e.failure_criteria)):null)}))},
async Graph(){const g=await api(`/projects/${st.pid}/graph`);if(!g.nodes.length)return h('div',{class:'empty'},'The graph is empty. Analyse a paper first.');

  h('h3',{style:'margin-top:16px'},'Recent harvest runs'),h('table',{},h('tbody',{},runs.map(r=>h('tr',{},h('td',{},r.source),h('td',{},r.query),h('td',{},h('span',{class:'tag '+(r.status==='ok'?'ok':'bad')},r.status)),h('td',{},r.fetched+' fetched, '+r.new+' new'),h('td',{class:'err'},r.error||''))))))},
